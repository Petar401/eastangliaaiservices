name: HTML Validate & Link Check

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "sitemap.xml"
      - ".htmlvalidate.json"
      - ".github/workflows/html-check.yml"
  pull_request:
    paths:
      - "**/*.html"
      - "sitemap.xml"
      - ".htmlvalidate.json"
      - ".github/workflows/html-check.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  html-validate:
    name: HTML validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Blocking: the site validates cleanly against .htmlvalidate.json
      # (recommended rules, with inline styles allowed by design). Version is
      # pinned so a new release can't start failing builds on its own.
      - name: Run html-validate
        run: npx --yes html-validate@9 "**/*.html"

  link-check:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Blocking. 403 (and LinkedIn's 999) are accepted because many
      # government, academic and news sites refuse automated requests while
      # the page itself is fine; genuinely dead links still fail (404, 410,
      # DNS errors, timeouts). Web3Forms is a POST-only API endpoint, and
      # mckinsey.com rejects lychee's HTTP/2 client, so both are excluded.
      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}
            --max-retries 2
            --timeout 20
            --accept 200,201,202,203,204,206,301,302,303,307,308,403,999
            --exclude ^https://api\.web3forms\.com/
            --exclude ^https://www\.mckinsey\.com/
            './**/*.html' './**/*.xml'
          fail: true

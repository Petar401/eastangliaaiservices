<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Space Mono', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07071a"/>
      <stop offset="0.55" stop-color="#0d0d2b"/>
      <stop offset="1" stop-color="#010108"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00ffe7" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#00ffe7" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#00ffe7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bf00ff" stop-opacity="0.36"/>
      <stop offset="0.55" stop-color="#bf00ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#bf00ff" stop-opacity="0"/>

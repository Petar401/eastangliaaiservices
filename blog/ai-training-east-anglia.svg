    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ffe7"/>
      <stop offset="0.5" stop-color="#e8eaf6"/>
      <stop offset="1" stop-color="#bf00ff"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">

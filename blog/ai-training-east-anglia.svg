  <text x="80" y="632" fill="#6b7280" font-size="15" letter-spacing="3">EAST ANGLIA AI SERVICES &#183; NORWICH &#183; IPSWICH &#183; CAMBRIDGE &#183; NORFOLK &#183; SUFFOLK &#183; ESSEX</text>


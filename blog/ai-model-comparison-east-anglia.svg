    <radialGradient id="glowL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00ffe7" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#00ffe7" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#00ffe7" stop-opacity="0"/>
